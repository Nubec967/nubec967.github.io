<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="keywords" content="CaGan,CaGan官网,Minecraft,我的世界,Minecraft0.14,Java,MC服务器" />
    <meta name="description" content="CaGan Minecraft 服务器官网 - 页面未找到" />
    <meta name="author" content="Cake(3428353923)" />
    <meta name="robots" content="noindex" />
    <title>404 Not Found | Minecraft CaGan Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --accent: #4ade80;
            --accent-dark: #22c55e;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --radius: 12px;
            --max-width: 800px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Arial", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            padding: 56px 20px 48px;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a2e 100%);
            border-bottom: 2px solid rgba(74, 222, 128, 0.15);
        }

        .header-title {
            margin: 0;
            font-size: 2.4em;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            margin: 10px 0 0;
            font-size: 1.05em;
            color: var(--text-muted);
        }

        /* ===== Main ===== */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px 56px;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* ===== Error Card ===== */
        .error-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(74, 222, 128, 0.1);
            border-radius: var(--radius);
            padding: 44px 32px 40px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .error-card:hover {
            border-color: rgba(74, 222, 128, 0.35);
        }

        .error-code {
            margin: 0;
            font-size: 6.5em;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .error-title {
            margin: 18px 0 8px;
            font-size: 1.4em;
            font-weight: 600;
            color: var(--accent);
        }

        .error-desc {
            margin: 0 auto 6px;
            max-width: 480px;
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .error-tip {
            margin: 18px 0 0;
            padding: 12px 16px;
            display: inline-block;
            font-size: 0.86em;
            color: var(--text-muted);
            background: rgba(74, 222, 128, 0.06);
            border: 1px dashed rgba(74, 222, 128, 0.25);
            border-radius: 8px;
        }

        /* ===== Buttons ===== */
        .error-actions {
            margin-top: 28px;
        }

        .card-btn {
            display: inline-block;
            margin: 6px 5px 0;
            padding: 9px 22px;
            background: var(--accent);
            color: #0f0f23;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, transform 0.15s;
        }

        .card-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .card-btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid rgba(74, 222, 128, 0.4);
        }

        .card-btn-secondary:hover {
            background: rgba(74, 222, 128, 0.1);
            border-color: var(--accent);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 24px 16px;
            border-top: 1px solid rgba(74, 222, 128, 0.1);
            color: var(--text-muted);
        }

        .footer a {
            text-decoration: none;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        .footer img {
            width: 16px;
            height: 16px;
        }

        .footer span {
            font-size: 12px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .header-title {
                font-size: 1.7em;
            }

            .header {
                padding: 40px 16px 36px;
            }

            .error-card {
                padding: 32px 20px 30px;
            }

            .error-code {
                font-size: 4.4em;
                letter-spacing: 4px;
            }

            .error-title {
                font-size: 1.15em;
            }

            .card-btn {
                display: block;
                margin: 10px auto 0;
                max-width: 260px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="header-title">Minecraft CaGan Server</h1>
        </div>
    </header>

    <main class="main">
        <section class="error-card">
            <p class="error-code">404</p>
            <h2 class="error-title">这里的方块被挖掉了</h2>
            <p class="error-desc">
                你访问的页面不存在，可能已经被移除、改名，或者从来没有生成过。
            </p>
            <p class="error-tip">提示：检查一下链接是否拼写正确，或者从首页重新进入。</p>

            <div class="error-actions">
                <a class="card-btn" href="/">返回首页</a>
                <a class="card-btn card-btn-secondary" href="https://www.nubec.top/cagan/" target="_blank"
                    rel="noopener">前往官网</a>
                <a class="card-btn card-btn-secondary" href="https://blog.danevan.top/posts/help-cagan/" target="_blank"
                    rel="noopener">快速入门</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <a href="https://icp.gov.moe/?keyword=20240922" target="_blank" rel="noopener">
                <img src="icon/icon.png" alt="萌ICP" />
                <span>萌ICP备20240922号</span>
            </a>
        </div>
    </footer>
</body>

</html>
